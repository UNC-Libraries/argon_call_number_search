name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3']
    name: Ruby ${{ matrix.ruby }}

    steps:
    - uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}

    - name: Install Bundler 4
      run: |
        gem install bundler -v '~> 4.0' --no-document

    - name: Install dependencies
      run: bundle install

    - name: Run rubocop
      run: rubocop

    - name: Run tests
      run: rspec
